[project]
name = "mail-sort-workspace"
version = "0.1.0"
description = "Development workspace for Mail Sort services and shared packages"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.sources]
mail-sort-contracts = { workspace = true }
mail-sort-database = { workspace = true }
mail-sort-repositories = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "services/*",
  "tools/*",
]
