[project]
name = "mail-sort-workspace"
version = "0.1.0"
description = "Development workspace for Mail Sort applications and shared packages"
requires-python = ">=3.12"
dependencies = [
  "mail-sort-contracts",
  "mail-sort-database",
  "mail-sort-logging",
  "mail-sort-alerts",
  "mail-collector",
  "mail-decision",
  "mail-router",
  "alert-dispatcher",
  "health-monitor",
  "dashboard-api",
  "mail-destination-setup",
  "mail-database-reset",
  "mail-job-inspect",
]

[tool.uv]
package = false

[tool.uv.sources]
mail-sort-contracts = { workspace = true }
mail-sort-database = { workspace = true }
mail-sort-logging = { workspace = true }
mail-sort-alerts = { workspace = true }
mail-collector = { workspace = true }
mail-decision = { workspace = true }
mail-router = { workspace = true }
alert-dispatcher = { workspace = true }
health-monitor = { workspace = true }
dashboard-api = { workspace = true }
mail-destination-setup = { workspace = true }
mail-database-reset = { workspace = true }
mail-job-inspect = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "apps/alert-dispatcher",
  "apps/mail-collector",
  "apps/mail-decision",
  "apps/health-monitor",
  "apps/mail-router",
  "apps/dashboard/api",
  "tools/*",
]
