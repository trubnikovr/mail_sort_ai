[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mail-router"
version = "0.1.0"
description = "Routes classified Mail Sort messages through mailbox providers"
requires-python = ">=3.12"
dependencies = [
  "exchangelib>=5,<6",
  "mail-sort-contracts==0.1.0",
  "mail-sort-alerts==0.1.0",
  "mail-sort-database==0.1.0",
  "mail-sort-logging==0.1.0",
]

[project.scripts]
mail-router = "mail_router.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_router"]
