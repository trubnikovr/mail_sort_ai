[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mail-health"
version = "0.1.0"
description = "Health endpoints for Mail Sort dependencies"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34,<2.0",
  "mail-sort-database==0.1.0",
  "mail-sort-logging==0.1.0",
]

[project.scripts]
mail-health = "mail_health.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_health"]
