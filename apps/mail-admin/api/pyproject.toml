[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mail-admin-api"
version = "0.1.0"
description = "Operational API for the Mail Sort admin console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "itsdangerous>=2.2,<3.0",
  "mail-sort-database==0.1.0",
]

[project.scripts]
mail-admin-api = "mail_admin_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_admin_api"]
