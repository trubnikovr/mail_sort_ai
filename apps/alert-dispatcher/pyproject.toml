[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alert-dispatcher"
version = "0.1.0"
description = "Delivers durable Mail Sort operational alerts"
requires-python = ">=3.12"
dependencies = [
  "mail-sort-alerts==0.1.0",
  "mail-sort-database==0.1.0",
  "mail-sort-logging==0.1.0",
]

[project.scripts]
alert-dispatcher = "alert_dispatcher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_dispatcher"]
